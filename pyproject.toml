[project]
name = "nautilus-paper-research-os"
version = "0.1.0"
description = "Replay-first, live-paper NautilusTrader research OS with ledger and dashboard hooks."
requires-python = ">=3.12"
dependencies = [
  "nautilus-trader>=1.227.0",
  "perspective-python>=4.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
npro = "nautilus_research_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nautilus_research_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
